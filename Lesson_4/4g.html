<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .tbtn {
    background-color: rgb(29, 155, 240);
    color: white;
    border: none;

    padding: 10px 16px 10px 16px;

    border-radius: 18px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    margin-left: 8px;
    transition: box-shadow 0.15s;
    vertical-align: top;
  }

  .tbtn:hover {
    box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
  }

  .sbtn{

    background-color: rgb(204, 0, 0);

    color: white;
    border: none;
    border-radius: 2px;
    cursor: pointer;
    margin-right: 8px;
    margin-left: 20px;
    padding: 10px 16px 10px 16px;
    transition: opacity 0.15s;
    vertical-align: top;
  }
</style>
</head>
<body>
    <button class="sbtn">Subscribe</button>
     <button class="tbtn">Tweet</button>
</body>
</html>
