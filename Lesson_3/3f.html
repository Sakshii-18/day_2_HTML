<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
  .amazon{
    color: rgb(0, 113, 133);
  }

  .amazon:hover {
    color: rgb(199, 81, 31);
  }

  .title {
    font-size: 24px;
    font-weight: bold;
  }

  .stock {
    color: rgb(0, 136, 0);
    font-weight: bold;
  }

  .cartBtn {
    background-color: rgb(249, 217, 76);
    border: none;
    height: 30px;
    width: 110px;
    border-radius: 15px;
    margin-right: 8px;
    cursor: pointer;
  }

  .cartBtn:hover {
    background-color: rgb(247, 202, 0);
  }

  .cartBtn:active {
    opacity: 0.5;
  }

  .buy {
    background-color: rgb(255, 164, 28);
    border: none;
    height: 30px;
    width: 110px;
    border-radius: 15px;
    cursor: pointer;
  }

  .buy:hover {
    background-color: rgb(250, 137, 0);
  }

  .buy:active {
    opacity: 0.5;
  }
</style>

<a class="amazon" href="https://amazon.com">
  Back to Amazon
</a>

<p class="title">
  Nike Black Running Shoes
</p>

<p class="stock">
  $39 - in stock.
</p>

<p>
  Free delivery tomorrow.
</p>

<button class="cartBtn">
  Add to Cart
</button>

<button class="buy">
  Buy now
</button>
</body>
</html>
